    description: |
      Joined as a software engineer, promoted to software architect. Built the .NET abstraction over the 3270 mainframe protocol from IBM documentation - powering both AxxessBlackScreen, a modern web emulator for the 3270 terminal, and the Medicare DDE scraping system. Scaled that scraper - built to survive Medicare's monthly breaking changes - to over 1 million managed patients, until a formal letter from Medicare mandated a throttle after our traffic visibly slowed the DDE mainframe on weekday mornings.

