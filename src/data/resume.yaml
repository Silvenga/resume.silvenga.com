  - label: Senior Software Engineer, .NET Agent Security Team
    entity: Contrast Security
    remote: true
    timeRange:
      fromYear: 2018
      toYear: 2023
    description: |
      Built and maintained the .NET Contrast Agent - deep runtime work: IL manipulation and generation, hot-path analysis optimizing for low-latency GC, CLR and CoreCLR internals across .NET Framework (3.5-4.8) and .NET (Core 2.1-3.1, 6, 7), and reverse engineering of .NET assemblies for vulnerability evaluation and IL hooks.

      Architected and helped implement automatic injection of .NET/Java/NodeJS/PHP agents into existing Kubernetes workloads with a Kubernetes operator. The operator was designed to operate in large Kubernetes clusters of over 10,000 pods through the use of techniques such as back pressure control, event stream compression, etc. The Kubernetes operator is now [Open Source](https://github.com/Contrast-Security-OSS/agent-operator).

      Architected and implemented a telemetry aggregation and error reporting service cluster. The entirety of this service was designed, implemented, and deployed by the .NET agent team - including concerns such as high availability, horizontal scaling, infrastructure security, abuse detection and mitigation, time series based reporting, etc.
