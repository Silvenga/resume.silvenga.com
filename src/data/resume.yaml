    entity: Bluefin Clinical, Inc.
    remote: true
    timeRange:
      fromYear: 2024
      toYear: now
    description: |
      The first hire at this early-stage startup, owning architecture and product decisions alongside the founders - from securing the K8s cluster and writing database migrations to writing the Rust simulation core and building responsive UIs with React.

      The Bluefin platform simulates clinical trials in near realtime using a digital-twin model rather than Monte Carlo: enrollment, dosing, supply chain, and supply acquisition across thousands of patients and hundreds of sites, a problem recursive in nature since supply and demand drive each other.

      The Rust engine runs entirely in the browser on average business laptops - via WASM, on a single core, in under 200MiB of memory - hitting sub-second latency with a 200ms target, in an industry where competitors rely on on-prem server fleets to scale.

      Worked the platform through SOC 2 Type II compliance with multi-region, highly-available infrastructure on AWS and Kubernetes. Currently driving an independent mirror of the AWS production infrastructure into Azure. The platform is in production use by two of the world's 50 largest pharmaceutical companies.

      Currently directs open-weight coding agents on custom harnesses for most implementation, focusing on architecture, product, and the problems agents can't solve.
